# git_service 公開契約の仕様案。実装済みの設定形式ではありません。
version: 1
name: hello-service
definitions:
  process_values: &process_values
    pipe:
      - items($inputs)
      - map("{k}={v}")
      - quote()
      - concat(" ")
  env_values: &env_values
    pipe:
      - items($inputs)
      - map("{k}={v}")
      - quote()
      - map("-e {v}")
      - concat(" ")
  compose_inputs: &compose_inputs
    HTTP_PORT:
      type: integer
      required: true
      description: ホスト側の公開ポート
    COMPOSE_PROJECT_NAME:
      type: string
      required: true
      description: インスタンスを区別する Compose project name
queries:
  get_openapi:
    description: Hello API の OpenAPI スキーマ
    file: api/openapi.yaml
    content_type: application/yaml
  get_catalog:
    description: サービスのカタログ
    file: catalog.json
    content_type: application/json
actions:
  up:
    executor: shell
    inputs:
      <<: *compose_inputs
    command:
      - *process_values
      - docker compose -f compose.yaml up --detach
  status:
    executor: shell
    inputs:
      <<: *compose_inputs
    command:
      - *process_values
      - docker compose -f compose.yaml ps
  down:
    executor: shell
    inputs:
      <<: *compose_inputs
    command:
      - *process_values
      - docker compose -f compose.yaml down
  run:
    executor: shell
    inputs:
      <<: *compose_inputs
      APP_MODE:
        type: string
        required: true
        description: コンテナに渡すモード
    command:
      - *process_values
      - docker compose -f compose.yaml run --detach
      - *env_values
      - web
# command の各断片をスペースで連結し、POSIX sh で実行する仕様案です。
# 作業ディレクトリはリポジトリルート。Docker CLI と Docker 実行先が必要です。
