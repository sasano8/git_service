# git_service 公開契約の仕様案。実装済みの設定形式ではありません。
version: 1
name: hello-service
definitions:
  env_flags: &env_flags ["-e", "{name}={value}"]
queries:
  get_openapi:
    description: Hello API の OpenAPI スキーマ
    file: api/openapi.yaml
    content_type: application/yaml
  get_catalog:
    description: サービスのカタログ
    file: catalog.json
    content_type: application/json
actions:
  up:
    executor: compose
    file: compose.yaml
    arguments: [up, --detach]
    inputs:
      HTTP_PORT:
        type: integer
        required: true
        description: ホスト側の公開ポート
    process_env:
      HTTP_PORT:
        input: HTTP_PORT
  status:
    executor: compose
    file: compose.yaml
    arguments: [ps]
    # 起動時に保存したインスタンス設定を使う。
    process_env:
      HTTP_PORT:
        instance_input: HTTP_PORT
  down:
    executor: compose
    file: compose.yaml
    arguments: [down]
    process_env:
      HTTP_PORT:
        instance_input: HTTP_PORT
  run:
    executor: compose
    file: compose.yaml
    inputs:
      APP_MODE:
        type: string
        required: true
        description: 実行するコンテナに渡すモード
    process_env:
      HTTP_PORT:
        instance_input: HTTP_PORT
    arguments:
      - run
      - --detach
      - expand:
          inputs: [APP_MODE]
          format: *env_flags
      - web
# compose executor は Docker 実行先を必要とします。
# run は一時コンテナを作る操作。停止には別途 docker rm -f <container-id> を使います。
