# git_service 公開契約の仕様案。実装済みの設定形式ではありません。
version: 1
name: hello-service
definitions:
  env_values: &env_values ["{name}={value}"]
  env_flags: &env_flags ["-e", "{name}={value}"]
  compose_inputs: &compose_inputs
    HTTP_PORT:
      type: integer
      required: true
      description: ホスト側の公開ポート
    COMPOSE_PROJECT_NAME:
      type: string
      required: true
      description: インスタンスを区別する Compose project name
queries:
  get_openapi:
    description: Hello API の OpenAPI スキーマ
    file: api/openapi.yaml
    content_type: application/yaml
  get_catalog:
    description: サービスのカタログ
    file: catalog.json
    content_type: application/json
actions:
  up:
    executor: shell
    command: env
    inputs:
      <<: *compose_inputs
    arguments:
      - expand:
          inputs: [HTTP_PORT, COMPOSE_PROJECT_NAME]
          format: *env_values
      - docker
      - compose
      - -f
      - compose.yaml
      - up
      - --detach
  status:
    executor: shell
    command: env
    inputs:
      <<: *compose_inputs
    arguments:
      - expand:
          inputs: [HTTP_PORT, COMPOSE_PROJECT_NAME]
          format: *env_values
      - docker
      - compose
      - -f
      - compose.yaml
      - ps
  down:
    executor: shell
    command: env
    inputs:
      <<: *compose_inputs
    arguments:
      - expand:
          inputs: [HTTP_PORT, COMPOSE_PROJECT_NAME]
          format: *env_values
      - docker
      - compose
      - -f
      - compose.yaml
      - down
  run:
    executor: shell
    command: env
    inputs:
      <<: *compose_inputs
      APP_MODE:
        type: string
        required: true
        description: コンテナに渡すモード
    arguments:
      - expand:
          inputs: [HTTP_PORT, COMPOSE_PROJECT_NAME]
          format: *env_values
      - docker
      - compose
      - -f
      - compose.yaml
      - run
      - --detach
      - expand:
          inputs: [APP_MODE]
          format: *env_flags
      - web
# shell executor は command と展開済み arguments を引数配列として実行します。
# 作業ディレクトリは対象リポジトリのルート。シェル文字列として評価しません。
# この操作には Docker CLI と実行先 Docker が必要です。
